# ops/docker-compose.yml


services:
  # Serviço do Backend (API FastAPI)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: juribot-api
    # O comando para iniciar a API com Uvicorn, permitindo recarga automática
    command: uvicorn app_main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Mapeia o código do backend para dentro do container para refletir mudanças ao vivo
      - ../backend:/app
      # Mapeia a pasta de dados para que a API possa acessá-la para ingestão
      - ../data:/app/data
    ports:
      # Disponível apenas no host durante a estabilização
      - "127.0.0.1:8000:8000"
    env_file:
      # Carrega as variáveis de ambiente do arquivo .env na raiz do projeto
      - ../.env
    depends_on:
      # A API só iniciará depois que o Qdrant e o Redis estiverem prontos
      - qdrant
      - redis
    networks:
      - juribot-net

  # Serviço do Frontend (Next.js)
  frontend:
    # Opcional durante a estabilização da API e da interface HTML
    profiles: ["frontend"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: juribot-frontend
    # O comando para iniciar o servidor de desenvolvimento do Next.js
    command: npm run dev
    volumes:
      # Mapeia o código do frontend para refletir mudanças ao vivo
      - ../frontend:/app
      # Evita que a pasta node_modules local seja mapeada, usando a do container
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - juribot-net
    depends_on:
      - api

  # Serviço do Banco de Dados Vetorial
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: juribot-qdrant
    # Sem publicação de portas: acesso pela rede do Compose
    volumes:
      # Garante que os dados do Qdrant persistam mesmo se o container for recriado
      - qdrant_data:/qdrant/storage
    networks:
      - juribot-net

  # Serviço de Cache e Memória de Conversa
  redis:
    image: redis:7.2-alpine
    container_name: juribot-redis
    # Sem publicação de portas: acesso pela rede do Compose
    volumes:
      # Garante que os dados do Redis persistam
      - redis_data:/data
    networks:
      - juribot-net

